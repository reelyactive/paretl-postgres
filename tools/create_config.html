<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Config JSON Generator</title>
  <style>
    body { font-family: "Segoe UI", Roboto, sans-serif; margin: 30px auto; max-width: 900px; color: #333; background: #fafafa; line-height: 1.5; }
    h2, h3 { color: #2c3e50; margin-bottom: 0.5em; }
    label { display: block; margin: 8px 0; font-weight: 500; }
    input, select, button { font: inherit; padding: 6px 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
    input[type="file"] { padding: 3px; }
    select[multiple] { height: 150px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px 20px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 6px; text-align: left; }
    th { background: #f0f0f0; }
    button { font-size: 14px; cursor: pointer; background: none; border: none; padding: 4px 8px; }
    button.add { color: #2c7be5; font-size: 18px; }
    button.remove { color: #e74c3c; font-size: 18px; }
    button.generate { background: #2c7be5; color: #fff; border-radius: 4px; padding: 8px 14px; }
    button.generate:hover { background: #1a5fb4; }
    pre { background: #272822; color: #f8f8f2; padding: 15px; border-radius: 6px; overflow-x: auto; margin-top: 15px; }
    .section { background: #fff; padding: 20px; border-radius: 6px; margin-bottom: 25px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    #langSwitch { float: right; margin-top: -10px; }
  </style>
</head>
<body>
  <h2 id="title">Config JSON Generator <button id="langSwitch" style="font-size:18px; border:none; background:none; cursor:pointer;">🇫🇷</button></h2>
  <div class="section">
    <h3 id="generalTitle">General</h3>
    <div class="form-grid">
      <label id="lblEvent">Event Name <input type="text" id="event_name"></label>
      <label id="lblStart">Start TS <input type="datetime-local" id="start_ts"></label>
      <label id="lblEnd">End TS <input type="datetime-local" id="end_ts"></label>
      <label id="lblCSV">Receivers (CSV) <input type="file" id="receiverFile" accept=".csv"></label>
    </div>
    <label id="lblReceivers">Receivers List:</label>
    <select id="receivers_id" multiple></select>
  </div>

  <div class="section">
    <h3 id="dbTitle">Database Settings</h3>
    <div class="form-grid">
      <label id="lblDBType">DB Type <input type="text" id="db_type" value="postgresql"></label>
      <label id="lblHost">Host <input type="text" id="db_host" value="localhost"></label>
      <label id="lblPort">Port <input type="number" id="db_port" value="5432"></label>
      <label id="lblUser">User <input type="text" id="db_user" value="reelyactive"></label>
      <label id="lblPass">Password <input type="password" id="db_pass" value="paretoanywhere"></label>
      <label id="lblName">Name <input type="text" id="db_name" value="pareto_anywhere"></label>
    </div>
  </div>

  <div class="section">
    <h3 id="tableTitle">Tables</h3>
    <div class="form-grid">
      <label id="lblSource">Source Table <input type="text" id="source_table" value="raddec"></label>
      <label id="lblTarget">Target Table <input type="text" id="target_table" value="etl_raddec"></label>
      <label id="lblWatchdog">Watchdog Table <input type="text" id="watchdog_table" value="etl_watchdog"></label>
    </div>
  </div>

  <div class="section">
    <h3 id="filterTitle">Filters</h3>
    <table id="filterTable">
      <tr>
        <th id="thName">Name</th>
        <th id="thColumn">Column</th>
        <th id="thOp">Operator</th>
        <th id="thVal">Value</th>
        <th></th>
      </tr>
    </table>
    <button type="button" class="add" onclick="addFilter()">➕</button>
  </div>

  <div style="text-align: right; margin-bottom: 20px;">
    <button type="button" class="generate" id="btnGenerate" onclick="generateJSON()">Generate JSON</button>
  </div>

  <h3 id="outputTitle">Generated JSON</h3>
  <pre id="output"></pre>

  <script>
    const columns = [
      "transmitterid", "numberofdecodings", "receiverid", "rssi", "timestamp",
      "duration_seconds", "max_rssi", "nb_counts", "digit_2", "is_private"
    ];

    // dictionnaire EN/FR
    const dict = {
      en: { title: "Config JSON Generator", generalTitle: "General", lblEvent: "Event Name", lblStart: "Start TS", lblEnd: "End TS", lblCSV: "Receivers (CSV)", lblReceivers: "Receivers List:", dbTitle: "Database Settings", lblDBType: "DB Type", lblHost: "Host", lblPort: "Port", lblUser: "User", lblPass: "Password", lblName: "Name", tableTitle: "Tables", lblSource: "Source Table", lblTarget: "Target Table", lblWatchdog: "Watchdog Table", filterTitle: "Filters", thName: "Name", thColumn: "Column", thOp: "Operator", thVal: "Value", btnGenerate: "Generate JSON", outputTitle: "Generated JSON", phFilterName: "Filter name", phText: "Text value", phNumber: "Numeric value" },
      fr: { title: "Générateur de Config JSON", generalTitle: "Général", lblEvent: "Nom de l'événement", lblStart: "Début", lblEnd: "Fin", lblCSV: "Récepteurs (CSV)", lblReceivers: "Liste des récepteurs :", dbTitle: "Paramètres Base de Données", lblDBType: "Type de BD", lblHost: "Hôte", lblPort: "Port", lblUser: "Utilisateur", lblPass: "Mot de passe", lblName: "Nom", tableTitle: "Tables", lblSource: "Table source", lblTarget: "Table cible", lblWatchdog: "Table de surveillance", filterTitle: "Filtres", thName: "Nom", thColumn: "Colonne", thOp: "Opérateur", thVal: "Valeur", btnGenerate: "Générer JSON", outputTitle: "JSON Généré", phFilterName: "Nom du filtre", phText: "Valeur texte", phNumber: "Valeur numérique" }
    };

    let currentLang = "en";

    function switchLang() {
      currentLang = (currentLang === "en") ? "fr" : "en";
      const langData = dict[currentLang];
      document.getElementById("title").childNodes[0].nodeValue = langData.title + " ";
      document.getElementById("generalTitle").textContent = langData.generalTitle;
      document.getElementById("lblEvent").childNodes[0].nodeValue = langData.lblEvent + " ";
      document.getElementById("lblStart").childNodes[0].nodeValue = langData.lblStart + " ";
      document.getElementById("lblEnd").childNodes[0].nodeValue = langData.lblEnd + " ";
      document.getElementById("lblCSV").childNodes[0].nodeValue = langData.lblCSV + " ";
      document.getElementById("lblReceivers").textContent = langData.lblReceivers;
      document.getElementById("dbTitle").textContent = langData.dbTitle;
      document.getElementById("lblDBType").childNodes[0].nodeValue = langData.lblDBType + " ";
      document.getElementById("lblHost").childNodes[0].nodeValue = langData.lblHost + " ";
      document.getElementById("lblPort").childNodes[0].nodeValue = langData.lblPort + " ";
      document.getElementById("lblUser").childNodes[0].nodeValue = langData.lblUser + " ";
      document.getElementById("lblPass").childNodes[0].nodeValue = langData.lblPass + " ";
      document.getElementById("lblName").childNodes[0].nodeValue = langData.lblName + " ";
      document.getElementById("tableTitle").textContent = langData.tableTitle;
      document.getElementById("lblSource").childNodes[0].nodeValue = langData.lblSource + " ";
      document.getElementById("lblTarget").childNodes[0].nodeValue = langData.lblTarget + " ";
      document.getElementById("lblWatchdog").childNodes[0].nodeValue = langData.lblWatchdog + " ";
      document.getElementById("filterTitle").textContent = langData.filterTitle;
      document.getElementById("thName").textContent = langData.thName;
      document.getElementById("thColumn").textContent = langData.thColumn;
      document.getElementById("thOp").textContent = langData.thOp;
      document.getElementById("thVal").textContent = langData.thVal;
      document.getElementById("btnGenerate").textContent = langData.btnGenerate;
      document.getElementById("outputTitle").textContent = langData.outputTitle;
      document.getElementById("langSwitch").textContent = (currentLang === "en") ? "🇫🇷" : "🇬🇧";
    }
    document.getElementById("langSwitch").addEventListener("click", switchLang);

    function addFilter() {
      const table = document.getElementById("filterTable");
      const row = table.insertRow(-1);
      const langData = dict[currentLang];
      let cell = row.insertCell(0);
      cell.innerHTML = `<input type="text" placeholder="${langData.phFilterName}">`;
      cell = row.insertCell(1);
      const colSelect = document.createElement("select");
      columns.forEach(col => {
        const opt = document.createElement("option");
        opt.value = col;
        opt.textContent = col;
        colSelect.appendChild(opt);
      });
      colSelect.onchange = () => updateValueInput(row, colSelect.value);
      cell.appendChild(colSelect);
      cell = row.insertCell(2);
      cell.innerHTML = `
        <select>
          <option value="==">==</option>
          <option value="!=">!=</option>
          <option value=">">&gt;</option>
          <option value=">=">&gt;=</option>
          <option value="<">&lt;</option>
          <option value="<=">&lt;=</option>
        </select>`;
      cell = row.insertCell(3);
      cell.innerHTML = `<input type="text" placeholder="${langData.phText}">`;
      cell = row.insertCell(4);
      cell.innerHTML = '<button type="button" class="remove" onclick="this.closest(\'tr\').remove()">❌</button>';
    }

    function updateValueInput(row, colValue) {
      const langData = dict[currentLang];
      const valueCell = row.cells[3];
      if (colValue === "is_private") {
        valueCell.innerHTML = `
          <select>
            <option value="true">true</option>
            <option value="false">false</option>
          </select>`;
      } else if (["transmitterid", "receiverid", "digit_2"].includes(colValue)) {
        valueCell.innerHTML = `<input type="text" placeholder="${langData.phText}">`;
      } else {
        valueCell.innerHTML = `<input type="number" placeholder="${langData.phNumber}">`;
      }
    }

    function generateJSON() {
      const receivers = Array.from(document.getElementById("receivers_id").selectedOptions).map(o => o.value);
      const filtering = [];
      const filterTable = document.getElementById("filterTable");
      for (let i = 1; i < filterTable.rows.length; i++) {
        const cells = filterTable.rows[i].cells;
        const name = cells[0].querySelector("input").value.trim();
        const col = cells[1].querySelector("select").value;
        const op = cells[2].querySelector("select").value;
        let valEl = cells[3].querySelector("input, select");
        let val = valEl.value;
        if (val.trim) val = val.trim();
        if (name && col && op && val !== "") {
          if (!isNaN(val) && val !== "") val = Number(val);
          else if (val.toLowerCase() === "true") val = true;
          else if (val.toLowerCase() === "false") val = false;
          filtering.push({ name, col, op, val });
        }
      }
      const config = {
        event_name: document.getElementById("event_name").value,
        start_ts: document.getElementById("start_ts").value.replace("T"," "),
        end_ts: document.getElementById("end_ts").value.replace("T"," "),
        receivers_id: receivers,
        db_type: document.getElementById("db_type").value,
        db_host: document.getElementById("db_host").value,
        db_port: Number(document.getElementById("db_port").value),
        db_user: document.getElementById("db_user").value,
        db_pass: document.getElementById("db_pass").value,
        db_name: document.getElementById("db_name").value,
        source_table: document.getElementById("source_table").value,
        target_table: document.getElementById("target_table").value,
        watchdog_table: document.getElementById("watchdog_table").value,
        log_level: "INFO",
        dry_run: false,
        filtering: filtering
      };
      const jsonStr = JSON.stringify(config, null, 2);
      document.getElementById("output").textContent = jsonStr;

      // --- Téléchargement auto en fichier JSON ---
      const blob = new Blob([jsonStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "config.json";
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
